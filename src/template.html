<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SD OS Suite</title><style>/* __STYLES_PLACEHOLDER__ */</style></head>
<body><div class="layout"><aside id="sidebar"><div class="sidebar-head"><strong class="brand">SD OS Suite</strong><button id="sidebar-close" aria-label="Close navigation">×</button></div><nav aria-label="Main navigation" id="nav"></nav></aside><div class="workspace"><header><button id="menu" aria-label="Toggle navigation" aria-expanded="true">☰</button><span>Workspace</span><button id="search">Search</button><button id="ask" class="primary">Ask SD OS</button></header><div id="storage-status" role="status"></div><main id="main" tabindex="-1"></main></div></div>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="dialog-close" aria-label="Close">×</button></div><div id="dialog-body"></div></dialog>
<aside id="assistant" aria-label="Ask SD OS" hidden><div class="dialog-head"><h2>Ask SD OS</h2><div class="actions"><button type="button" id="assistant-expand" aria-pressed="false">Expand</button><button id="assistant-close" aria-label="Close assistant">×</button></div></div><p id="assistant-mode">Local commands · all data · type help</p><div id="assistant-starters" class="starters" role="group" aria-label="Starter actions"><button type="button" data-command="tickets">Ticket metrics</button><button type="button" data-command="list tasks">Open tasks</button><button type="button" data-command="validate roster">Validate roster</button><button type="button" data-command="help">Show commands</button></div><div id="conversation" aria-live="polite"></div><form id="assistant-form"><label for="assistant-input">Message</label><textarea id="assistant-input" rows="2" required></textarea><div class="actions"><button class="primary">Send</button><button type="button" id="assistant-clear">Clear conversation</button><button type="button" id="assistant-stop">Stop</button></div></form></aside>
<script>/* __XLSX_PLACEHOLDER__ */</script><script>/* __SCRIPTS_PLACEHOLDER__ */</script></body></html>
